# Org-profile CI. This checkout is the GitHub org repo, not a
# product tree. Product CI lives in each sibling repo. Reusable
# auto-release is openOODA/openOODA/.github/workflows/auto-release.yml.

name: org profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Org profile surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require org profile files
        run: |
          set -euo pipefail
          test -f docs/HOME.oot
          test -f profile/README.md
          test -f README.md
          test -f AGENTS.oot
          test -f ISSUE_TEMPLATE/bug_report.md
          test -f ISSUE_TEMPLATE/feature_request.md
          test -f LICENSE
          ! test -f workflows/release.yml
          echo "org profile: OK"
