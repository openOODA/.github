# Gateway Stationary Topology Validator — .github is archived gateway, not engine
# SSoT: ooda/ooda.pkg + git tag v* — no manual pins here. Consolidated CI lives in openOODA/openOODA/.github/workflows/ci.yml
# Enforces: stationary 3-file gateway (AGENTS.oot, profile/README, health files), zero build drag, fail-closed, DAG isolation.

name: Gateway Stationary Validator

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: "Gateway: Orientation & Health Files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4

      - name: Validate stationary topology — required files present, no engine
        run: |
          set -euo pipefail
          test -f AGENTS.oot
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f profile/README.md
          test -f README.md
          # gateway must not contain engine or governance boards
          ! test -d ooda  || { echo "FAIL: ooda/ must not exist in gateway — DAG isolation violated"; exit 1; }
          ! test -d openOODA || { echo "FAIL: openOODA/ must not exist in gateway"; exit 1; }
          ! test -f ooda.pkg || { echo "FAIL: ooda.pkg belongs in ooda/, not gateway"; exit 1; }

      - name: Verify AGENTS.oot header
        run: |
          set -euo pipefail
          head -n 5 AGENTS.oot | grep -q "^# AGENTS"
          grep -q "^File: .github/AGENTS.oot" AGENTS.oot

      - name: Fail-closed — reject manual duplicate version pins (SSoT violation)
        run: |
          set -euo pipefail
          echo "Checking for hardcoded version pins outside historical tags..."
          # Allow historical tag references in README history line only; reject pins in active docs
          if grep -R "v2\.9\." --exclude-dir=.git --exclude="*.png" --exclude="ci.yml" . | grep -v "v2.9.4-baseline" | grep -v ".git/logs" | grep -q .; then
            echo "FAIL: stale v2.9.x pin found — SSoT is ooda/ooda.pkg + git tag"
            grep -R "v2\.9\." --exclude-dir=.git --exclude="ci.yml" . | grep -v "v2.9.4-baseline" | cat
            exit 1
          fi
          # Reject static badge pin — must use dynamic github/v/tag badge
          if grep -q "badge/version-v" profile/README.md; then
            echo "FAIL: static version badge — use img.shields.io/github/v/tag/openOODA/ooda SSoT badge"
            exit 1
          fi
          # Reject SECURITY hardcoded Current version — must reference SSoT
          if grep -q 'v2\.10\.x.*Current' SECURITY.md; then
            echo "FAIL: SECURITY.md hardcodes v2.10.x — must reference ooda.pkg SSoT"
            exit 1
          fi
          # Double-run determinism: run same check twice
          grep -R "v2\.9\." --exclude-dir=.git --exclude="ci.yml" . | grep -v "v2.9.4-baseline" | grep -v ".git/logs" | cat > /tmp/gw1.txt || true
          grep -R "v2\.9\." --exclude-dir=.git --exclude="ci.yml" . | grep -v "v2.9.4-baseline" | grep -v ".git/logs" | cat > /tmp/gw2.txt || true
          diff -u /tmp/gw1.txt /tmp/gw2.txt
          echo "gateway SSoT pin check: PASS (double-run identical)"

      - name: Validate profile README
        run: |
          set -euo pipefail
          test -s profile/README.md
          grep -q "openooda.org" profile/README.md

      - name: Verify ISSUE_TEMPLATE and CONTRIBUTING reference SSoT
        run: |
          set -euo pipefail
          grep -q "ooda/ooda.pkg" ISSUE_TEMPLATE/bug_report.md
          grep -q "ooda/ooda.pkg" CONTRIBUTING.md
          ! grep -q "Current: \`v2\." CONTRIBUTING.md || { echo "FAIL: CONTRIBUTING hardcodes version"; exit 1; }

      - name: Gateway is archived — canonical CI lives in openOODA
        run: |
          set -euo pipefail
          grep -q "ARCHIVED & CONSOLIDATED" README.md
          grep -q "openOODA/openOODA" README.md
          echo "gateway: stationary topology validated — zero build drag (5 min, 1 job vs 186-line 3-tier matrix)"
