# Gateway has no release — releases are published from ooda/ooda.pkg SSoT (ooda repo)
# This workflow is archived. It fails closed with redirection. Canonical release: openOODA/openOODA/.github/workflows/release.yml → ooda repo.

name: Gateway Archived — No Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Archived: releases publish from ooda repo (ooda.pkg SSoT)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  archived:
    name: "Archived: gateway does not publish releases"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed with canonical redirection
        run: |
          set -euo pipefail
          echo "FAIL: .github is archived gateway — it does not publish releases."
          echo "Canonical release: push tag v* in openOODA/ooda (SSoT: ooda/ooda.pkg + git tag) "
          echo "Workflow: openOODA/openOODA/.github/workflows/release.yml"
          echo "See: https://github.com/openOODA/ooda/releases"
          exit 1
